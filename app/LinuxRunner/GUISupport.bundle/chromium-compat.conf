# Loaded by Debian's /usr/bin/chromium through /etc/chromium.d/.
# Guest PID/user namespaces and Chromium's Linux sandbox are not implemented
# completely by LinuxRunner. Keep distinct renderers, without the zygote path.
# The native iPadOS sandbox is unaffected. Opt out for runtime diagnostics with
# LINUXRUNNER_CHROMIUM_COMPAT=0 chromium.
if [ "${LINUXRUNNER_CHROMIUM_COMPAT:-1}" != 0 ]; then
    CHROMIUM_FLAGS="${CHROMIUM_FLAGS:-} --no-sandbox --no-zygote --disable-gpu --disable-gpu-compositing --renderer-process-limit=2 --js-flags=--jitless"
    export LIBGL_ALWAYS_SOFTWARE=1 LR_MESA_METAL_MODE=off
    printf '%s\n' 'CHROMIUM_COMPAT: linuxrunner=1 sandbox=off zygote=off gpu=software v8=jitless' >&2
fi
